databases:
  - name: swiss-career-intelligence-db
    databaseName: swiss_career_intelligence_db
    user: swiss_career_intelligence_db_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: swiss-career-intelligence-os
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/KumarNavish/navish-site
    branch: main
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swiss-career-intelligence-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SCIOS_ENVIRONMENT
        value: production
      - key: SCIOS_OWNER_EMAIL
        value: navish.kumar@unibas.ch
      - key: SCIOS_SESSION_SECURE_COOKIE
        value: 'true'
      - key: SCIOS_SESSION_TTL_DAYS
        value: '90'
      - key: SCIOS_TIMEZONE
        value: Europe/Zurich
      - key: SCIOS_WORKER_ENABLED
        value: 'true'
      - key: SCIOS_WORKER_INTERVAL_SECONDS
        value: '300'
      - key: SCIOS_MODEL_PROVIDER
        value: deterministic_gates_v5
      - key: SCIOS_MODEL_API_CALLS
        value: '0'

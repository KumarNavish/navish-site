name: Export source artifact on request

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  export:
    if: contains(github.event.issue.title, '[SOURCE ARTIFACT]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Build clean source snapshot
        run: |
          set -euo pipefail
          mkdir -p /tmp/export
          tar \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='*.db' \
            -czf /tmp/export/navish-site-source.tar.gz .
          sha256sum /tmp/export/navish-site-source.tar.gz > /tmp/export/navish-site-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: navish-site-source
          path: /tmp/export/
          retention-days: 1
          if-no-files-found: error
      - name: Publish run identifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Source artifact ready. Workflow run ID: ${{ github.run_id }}"

  apply-useful-workspace-repair:
    if: github.event.issue.user.login == 'KumarNavish' && contains(github.event.issue.title, '[APPLY USEFUL WORKSPACE REPAIR]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/useful-role-workspace-v2
          fetch-depth: 0
      - name: Apply the locally validated repair
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/repair.patch.gz.b64.part-* | base64 --decode | gzip --decompress --stdout > /tmp/useful-role-workspace.patch
          git apply --check /tmp/useful-role-workspace.patch
          git apply /tmp/useful-role-workspace.patch
          rm -rf .repair .repair-bootstrap
          rm -f .github/workflows/apply-useful-workspace-repair.yml
      - name: Verify repaired source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app app.py tests
          for file in static/*.js; do node --check "$file"; done
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          pytest -q
      - name: Commit repaired workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Swiss Career Intelligence Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild role application and preparation workspace'
          git push origin HEAD:fix/useful-role-workspace-v2
      - name: Publish repair result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Useful role workspace repair workflow completed with result: ${{ job.status }}. Workflow run ID: ${{ github.run_id }}"

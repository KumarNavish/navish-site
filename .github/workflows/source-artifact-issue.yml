name: Export source artifact on request

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  export:
    if: contains(github.event.issue.title, '[SOURCE ARTIFACT]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Build clean source snapshot
        run: |
          set -euo pipefail
          mkdir -p /tmp/export
          tar \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='*.db' \
            -czf /tmp/export/navish-site-source.tar.gz .
          sha256sum /tmp/export/navish-site-source.tar.gz > /tmp/export/navish-site-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: navish-site-source
          path: /tmp/export/
          retention-days: 1
          if-no-files-found: error
      - name: Publish run identifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Source artifact ready. Workflow run ID: ${{ github.run_id }}"

  patch-hosted-qa-selector:
    if: contains(github.event.issue.title, '[PATCH HOSTED QA SELECTOR]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch the visible preparation control selector
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/hosted-authenticated-browser.yml')
          source = path.read_text()
          old = "page.get_by_role('button', name='Prepare', exact=True).click()"
          new = "page.locator('[data-route=\"interviews\"]:visible').first.click()"
          if old not in source:
              raise SystemExit('expected Prepare selector not found')
          path.write_text(source.replace(old, new, 1))
          Path('.github/workflows/patch-hosted-qa-selector.yml').unlink(missing_ok=True)
          PY
      - name: Commit selector repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Swiss Career Intelligence QA'
          git config user.email 'actions@users.noreply.github.com'
          git add -A .github/workflows/hosted-authenticated-browser.yml .github/workflows/patch-hosted-qa-selector.yml
          git commit -m 'Use visible preparation control in hosted browser acceptance'
          git push origin HEAD:main
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Hosted browser acceptance selector repaired on main."

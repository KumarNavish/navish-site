name: Export source artifact on request

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  export:
    if: contains(github.event.issue.title, '[SOURCE ARTIFACT]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Build clean source snapshot
        run: |
          set -euo pipefail
          mkdir -p /tmp/export
          tar \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='*.db' \
            -czf /tmp/export/navish-site-source.tar.gz .
          sha256sum /tmp/export/navish-site-source.tar.gz > /tmp/export/navish-site-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: navish-site-source
          path: /tmp/export/
          retention-days: 1
          if-no-files-found: error
      - name: Publish run identifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Source artifact ready. Workflow run ID: ${{ github.run_id }}"

  apply-final-polish-fix:
    if: startsWith(github.event.issue.title, '[APPLY FINAL POLISH V14 FIX]')
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:////tmp/scios-final-polish-v14-fix.db
      SCIOS_WORKER_ENABLED: "false"
      SCIOS_SESSION_SECURE_COOKIE: "false"
      SCIOS_INTERNAL_SECRET: final-polish-v14-fix-secret
      SCIOS_ACCESS_TOKEN: final-polish-v14-fix-access
      SCIOS_OWNER_EMAIL: navish.kumar@unibas.ch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/final-polish-v14
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.8
          cache: pip
      - name: Install and apply fix
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          base64 --decode .automation/final-polish-v14-fix/patch.gz.b64 | gzip --decompress > /tmp/final-polish-v14-fix.patch
          echo '6e4e58d92c146bca6802744d2cb4005f78be67498cac44083cbf26abc4955762  /tmp/final-polish-v14-fix.patch' | sha256sum --check --strict
          patch -p1 --forward < /tmp/final-polish-v14-fix.patch
      - name: Verify product
        run: |
          node --check static/ui.js
          node --check static/personal-workspace.js
          node --check static/workspace-detail.js
          node --check static/workspace-access.js
          python -m compileall -q app app.py scripts tests
          pytest -q
      - name: Publish clean branch commit
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -rf .pytest_cache .automation/final-polish-v14-fix
          rm -f .final-polish-v14-fix-trigger
          rm -f .github/workflows/apply-final-polish-v14-fix.yml
          git config user.name 'Swiss Career Intelligence QA'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finish responsive QA and tighten interview rationale copy'
          git push origin HEAD:ux/final-polish-v14
      - name: Publish result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Final polish v14 fix application: success. Workflow run ID: ${{ github.run_id }}."

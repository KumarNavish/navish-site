name: Tighten Swiss high-conviction gates

on:
  push:
    branches: [main]
    paths:
      - 'tighten-quality-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Swiss-only high-conviction corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_block(text: str, start: str, end: str, replacement: str) -> str:
              left = text.find(start)
              if left < 0:
                  raise SystemExit(f'missing block start: {start}')
              right = text.find(end, left)
              if right < 0:
                  raise SystemExit(f'missing block end: {end}')
              return text[:left] + replacement.rstrip() + '\n\n' + text[right + 2:]

          intelligence = Path('app/intelligence.py')
          text = intelligence.read_text()
          text = replace_block(text, 'def swiss_eligible(', '\n\ndef target_role(', '''def swiss_eligible(location: str, description: str = "") -> bool:
    """Require structured Swiss location evidence before accepting a role.

    Company boilerplate is ignored whenever a structured non-Swiss location is
    present, so a Paris or London role cannot pass merely by mentioning Zurich.
    """

    structured = " ".join(str(location or "").split()).lower()
    explicit_swiss = any(place in structured for place in SWISS_PLACES) or bool(
        re.search(r"(?:^|[,(\\s])ch(?:$|[),\\s])", structured)
    )
    if explicit_swiss:
        return True
    if structured:
        if "remote" not in structured:
            return False
        remote_evidence = description[:1800].lower()
        return any(phrase in remote_evidence for phrase in (
            "work from switzerland", "working from switzerland", "based in switzerland",
            "resident in switzerland", "swiss employment", "swiss entity", "remote in switzerland",
        ))
    fallback = description[:1200].lower()
    return any(phrase in fallback for phrase in (
        "location: switzerland", "location: zurich", "location: zürich",
        "based in switzerland", "based in zurich", "based in zürich",
    ))''')
          text = replace_block(text, 'def extract_years(', '\n\ndef _years(', '''def extract_years(text: str) -> int:
    return _years(text)''')
          text = replace_block(text, 'def serious(', '\n\ndef application_package(', '''def serious(analysis: dict[str, Any]) -> bool:
    """Return true only for a compact, defensible attention portfolio."""

    interview = analysis.get("interview_probability_range") or [0, 0]
    compensation = analysis.get("compensation") or {}
    return (
        analysis.get("decision") in {"Strongly pursue", "Pursue", "Investigate one blocker"}
        and not analysis.get("severe_seniority_mismatch", False)
        and analysis.get("fit_score", 0) >= 62
        and analysis.get("hiring_opportunity_value", 0) >= 5.0
        and max(interview or [0]) >= 35
        and analysis.get("mandatory_evidence_strength", 0) >= 50
        and compensation.get("high", 0) >= 120000
    )''')
          intelligence.write_text(text)

          upgrade = Path('app/upgrade.py')
          text = upgrade.read_text()
          replacements = [
              ('''            if analysis.get("decision") not in {"Strongly pursue", "Pursue", "Investigate one blocker"}:
                continue
            ranked.append((job, analysis))''', '''            if not intelligence.serious(analysis):
                continue
            ranked.append((job, analysis))'''),
              ('                    observed_identifiers: set[str] = set()', '                    qualified_identifiers: set[str] = set()'),
              ('                        observed_identifiers.add(identifier)\n', ''),
              ('''                        if len(raw.get("description", "")) < 120:
                            rejected += 1
                            continue
                        analysis = intelligence.analyze_role(raw, evidence, profile.salary_floor_base)''', '''                        if len(raw.get("description", "")) < 120:
                            rejected += 1
                            continue
                        qualified_identifiers.add(identifier)
                        analysis = intelligence.analyze_role(raw, evidence, profile.salary_floor_base)'''),
              ('''                        source_row.accepted += 1
                        create_or_update_suggested_application(db, user.id, job, analysis)
                        if intelligence.serious(analysis):
                            accepted_jobs.append((job, analysis))''', '''                        source_row.accepted += 1
                        if intelligence.serious(analysis):
                            accepted_jobs.append((job, analysis))'''),
              ('''                        if meta.source_identifier not in observed_identifiers:
                            meta.active_status = "Closed or removed from official source"''', '''                        if meta.source_identifier not in qualified_identifiers:
                            meta.active_status = "Closed, removed, or excluded by Swiss/fit gate"'''),
              ('''                accepted_jobs.sort(key=lambda pair: (pair[1].get("hiring_opportunity_value", 0), pair[1].get("fit_score", 0)), reverse=True)
                # An explicit conservative internal rule may prepare—but never submit—the strongest verified role.
                auto_candidate = next((pair for pair in accepted_jobs if pair[1]["decision"] in {"Strongly pursue", "Pursue"} and pair[1]["compensation"]["high"] >= profile.salary_floor_base and pair[1]["fit_score"] >= 50), None)''', '''                accepted_jobs.sort(key=lambda pair: (pair[1].get("hiring_opportunity_value", 0), pair[1].get("fit_score", 0)), reverse=True)
                attention_portfolio = accepted_jobs[:5]
                portfolio_ids = {job.id for job, _ in attention_portfolio}
                for job, analysis in attention_portfolio:
                    create_or_update_suggested_application(db, user.id, job, analysis)
                for app_row in db.scalars(select(legacy.Application).where(legacy.Application.user_id == user.id, legacy.Application.state == "Suggested")).all():
                    if app_row.job_id not in portfolio_ids:
                        app_row.state = "Monitor"
                        app_row.next_action = "Outside the current five-role attention portfolio; reassess only after material change."
                # A conservative internal rule may prepare—but never submit—the strongest verified role.
                auto_candidate = next((pair for pair in attention_portfolio if pair[1]["decision"] in {"Strongly pursue", "Pursue"} and pair[1]["compensation"]["high"] >= profile.salary_floor_base), None)'''),
              ('''    @legacy.app.get("/api/live/roles")
    def live_roles(user: Any = Depends(legacy.current_user), db: Session = Depends(legacy.db_dep)) -> list[dict[str, Any]]:
        jobs = db.scalars(select(legacy.Job).where(legacy.Job.user_id == user.id).order_by(legacy.Job.score.desc(), legacy.Job.created_at.desc())).all()
        rows = [serialize_job(db, job) for job in jobs]
        return [row for row in rows if row["source_status"] != "Closed or removed from official source" and row["decision"] != "Do not pursue"][:15]''', '''    @legacy.app.get("/api/live/roles")
    def live_roles(user: Any = Depends(legacy.current_user), db: Session = Depends(legacy.db_dep)) -> list[dict[str, Any]]:
        ranked: list[dict[str, Any]] = []
        for job in db.scalars(select(legacy.Job).where(legacy.Job.user_id == user.id)).all():
            meta = db.scalar(select(OpportunityMeta).where(OpportunityMeta.job_id == job.id))
            analysis = _load(meta.analysis_json, {}) if meta else {}
            if meta and meta.source_name not in {"Manual official URL", "Pasted job description"}:
                if meta.active_status != "Active — verified from official source" or not intelligence.serious(analysis):
                    continue
            elif analysis.get("decision") == "Do not pursue":
                continue
            ranked.append(serialize_job(db, job))
        ranked.sort(key=lambda row: (row.get("hiring_opportunity_value", 0), row.get("fit_score", 0)), reverse=True)
        return ranked[:10]'''),
              ('''        rows = db.scalars(select(legacy.Application).where(legacy.Application.user_id == user.id).order_by(legacy.Application.id.desc())).all()''', '''        rows = db.scalars(select(legacy.Application).where(
            legacy.Application.user_id == user.id,
            legacy.Application.state.notin_(("Monitor", "Closed", "Withdrawn")),
        ).order_by(legacy.Application.id.desc()).limit(10)).all()'''),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'upgrade target not found: {old[:80]!r}')
              text = text.replace(old, new, 1)
          upgrade.write_text(text)

          public_ops = Path('app/public_ops.py')
          text = public_ops.read_text()
          if 'from . import intelligence\n' not in text:
              text = text.replace('from sqlalchemy import func, select, text\n', 'from sqlalchemy import func, select, text\n\nfrom . import intelligence\n', 1)
          old = '''                if analysis.get("decision") in {"Strongly pursue", "Pursue", "Investigate one blocker"}:
                    serious_roles += 1'''
          if old not in text:
              raise SystemExit('public ops serious target not found')
          public_ops.write_text(text.replace(old, '''                if intelligence.serious(analysis):
                    serious_roles += 1''', 1))

          tests = Path('tests/test_live_system.py')
          text = tests.read_text()
          old = '''    assert intelligence.swiss_eligible("Zürich, Switzerland") is True
    assert intelligence.swiss_eligible("London, United Kingdom") is False'''
          if old not in text:
              raise SystemExit('Swiss location test target not found')
          text = text.replace(old, '''    assert intelligence.swiss_eligible("Zürich, Switzerland") is True
    assert intelligence.swiss_eligible("London, United Kingdom") is False
    assert intelligence.swiss_eligible("Paris", "Our company also has offices in Zurich and London") is False
    assert intelligence.swiss_eligible("Remote", "This role may be performed while resident in Switzerland") is True''', 1)
          old = '''        assert applications
        assert all(row.external_action_executed is False for row in applications)'''
          if old not in text:
              raise SystemExit('portfolio size test target not found')
          tests.write_text(text.replace(old, '''        assert 1 <= len(applications) <= 5
        assert all(row.external_action_executed is False for row in applications)''', 1))
          PY
          python -W error::SyntaxWarning -m compileall -q app tests
          git config user.name 'Swiss Career Intelligence Maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git add app/intelligence.py app/upgrade.py app/public_ops.py tests/test_live_system.py
          git commit -m 'Enforce Swiss-only five-role high-conviction portfolio'
          git push origin HEAD:main

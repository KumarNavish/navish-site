name: Apply focused final polish fixes

on:
  push:
    branches: [ux/final-polish-v14]
    paths: [.final-polish-v14-fix-trigger]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:////tmp/scios-final-polish-v14-fix.db
      SCIOS_WORKER_ENABLED: "false"
      SCIOS_SESSION_SECURE_COOKIE: "false"
      SCIOS_INTERNAL_SECRET: final-polish-v14-fix-secret
      SCIOS_ACCESS_TOKEN: final-polish-v14-fix-access
      SCIOS_OWNER_EMAIL: navish.kumar@unibas.ch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/final-polish-v14
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.8
          cache: pip
      - name: Install and apply fix
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          base64 --decode .automation/final-polish-v14-fix/patch.gz.b64 | gzip --decompress > /tmp/final-polish-v14-fix.patch
          echo '6e4e58d92c146bca6802744d2cb4005f78be67498cac44083cbf26abc4955762  /tmp/final-polish-v14-fix.patch' | sha256sum --check --strict
          patch -p1 --forward < /tmp/final-polish-v14-fix.patch
      - name: Verify product
        run: |
          node --check static/ui.js
          node --check static/personal-workspace.js
          node --check static/workspace-detail.js
          node --check static/workspace-access.js
          python -m compileall -q app app.py scripts tests
          pytest -q
      - name: Publish clean fix commit
        run: |
          set -euo pipefail
          rm -rf .automation/final-polish-v14-fix
          rm -f .final-polish-v14-fix-trigger
          rm -f .github/workflows/apply-final-polish-v14-fix.yml
          git config user.name 'Swiss Career Intelligence QA'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finish responsive QA and tighten interview rationale copy'
          git push origin HEAD:ux/final-polish-v14

name: Normalize production source warnings

on:
  push:
    branches: [main]
    paths:
      - 'normalize-source-trigger.txt'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact warning-removal edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          intelligence = Path('app/intelligence.py')
          text = intelligence.read_text()
          updated = text.replace('"c\\+\\+"', '"c++"', 1)
          if updated == text:
              raise SystemExit('Expected escaped C++ dictionary key was not found')
          intelligence.write_text(updated)

          upgrade = Path('app/upgrade.py')
          text = upgrade.read_text()
          decorator = '    @legacy.app.on_event("startup")\n    def automation_startup() -> None:'
          if decorator not in text:
              raise SystemExit('Expected startup decorator was not found')
          text = text.replace(decorator, '    def automation_startup() -> None:', 1)
          anchor = '        if os.getenv("SCIOS_WORKER_ENABLED", "true").lower() == "true":\n            start_worker()\n\n    @legacy.app.get("/healthz")'
          if anchor not in text:
              raise SystemExit('Expected startup registration anchor was not found')
          text = text.replace(anchor, '        if os.getenv("SCIOS_WORKER_ENABLED", "true").lower() == "true":\n            start_worker()\n\n    legacy.app.router.on_startup.append(automation_startup)\n\n    @legacy.app.get("/healthz")', 1)
          upgrade.write_text(text)
          PY
          python -W error::SyntaxWarning -m compileall -q app
          git config user.name 'Swiss Career Intelligence Maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git add app/intelligence.py app/upgrade.py
          git commit -m 'Remove production parser and startup deprecation warnings'
          git push origin HEAD:main

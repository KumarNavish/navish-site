name: Core flow v15 branch verification

on:
  push:
    branches: [fix/core-flow-clarity-v15]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'fix/core-flow-clarity-v15' || github.ref == 'refs/heads/fix/core-flow-clarity-v15'
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:////tmp/scios-core-flow-v15.db
      SCIOS_WORKER_ENABLED: 'false'
      SCIOS_SESSION_SECURE_COOKIE: 'false'
      SCIOS_INTERNAL_SECRET: core-flow-v15-ci-secret
      SCIOS_ACCESS_TOKEN: ci-private-access
      SCIOS_OWNER_EMAIL: navish.kumar@unibas.ch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.8
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app scripts tests
      - name: Check JavaScript syntax
        run: |
          for file in static/*.js; do node --check "$file"; done
      - name: Run complete suite
        run: pytest -q

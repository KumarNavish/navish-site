name: Swiss Career Intelligence scheduler

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scheduler-trigger.txt'

permissions:
  contents: read

concurrency:
  group: scios-scheduler
  cancel-in-progress: false

jobs:
  wake-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Execute deterministic work and enforce durability readiness
        shell: bash
        env:
          SCIOS_ORIGIN: https://swiss-career-intelligence-os.onrender.com
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 6 --retry-delay 5 --max-time 120 "$SCIOS_ORIGIN/healthz"
          echo
          ready_status=$(curl --show-error --silent --retry 6 --retry-delay 5 --max-time 120 \
            -o /tmp/ready.json -w '%{http_code}' "$SCIOS_ORIGIN/readyz")
          cat /tmp/ready.json
          echo
          if [ "$EVENT_NAME" = 'push' ] || [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            curl --fail --show-error --silent --retry 4 --retry-delay 8 --max-time 360 \
              -X POST -H 'Content-Type: application/json' -d '{}' \
              "$SCIOS_ORIGIN/api/scheduler/refresh"
          else
            curl --fail --show-error --silent --retry 4 --retry-delay 5 --max-time 240 \
              -X POST -H 'Content-Type: application/json' -d '{}' \
              "$SCIOS_ORIGIN/api/scheduler/tick"
          fi
          echo
          curl --fail --show-error --silent --retry 6 --retry-delay 5 --max-time 120 "$SCIOS_ORIGIN/ops/cost"
          echo
          curl --fail --show-error --silent --retry 6 --retry-delay 5 --max-time 120 "$SCIOS_ORIGIN/ops/summary"
          echo
          if [ "$ready_status" != '200' ]; then
            echo "Free PostgreSQL is unavailable; the app remains usable through browser-restored continuity mode."
          fi

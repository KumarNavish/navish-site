name: Repair authenticated workspace regression

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: repair-authenticated-workspace-regression
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.issue.title, '[BLANK FIX]')
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:////tmp/scios-blank-fix.db
      SCIOS_ENVIRONMENT: development
      SCIOS_WORKER_ENABLED: 'false'
      SCIOS_SESSION_SECURE_COOKIE: 'false'
      SCIOS_INTERNAL_SECRET: blank-fix-validation-secret
      SCIOS_ACCESS_TOKEN: ci-private-access
      SCIOS_OWNER_EMAIL: navish.kumar@unibas.ch
      SCIOS_TEST_MODE: 'true'
      SCIOS_TEST_ACCESS_TOKENS: ci-private-access,workspace-private-access
      OPENAI_ENABLED: 'false'
      PAID_SERVICES_ALLOWED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-authenticated-blank-page
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Repair concurrent application-workspace creation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/workspace.py')
          source = path.read_text()
          if 'import time\n' not in source:
              source = source.replace('import json\n', 'import json\nimport time\n', 1)
          if 'from sqlalchemy.exc import IntegrityError\n' not in source:
              source = source.replace(
                  'from sqlalchemy import DateTime, ForeignKey, Integer, String, Text, func, select\n',
                  'from sqlalchemy import DateTime, ForeignKey, Integer, String, Text, func, select\nfrom sqlalchemy.exc import IntegrityError\n',
                  1,
              )

          start = source.index('    def ensure_workspace(')
          end = source.index('\n    def timeline(', start)
          replacement = '''    def ensure_workspace(
              db: Session, application: Any, job: Any
          ) -> ApplicationWorkspace:
              query = select(ApplicationWorkspace).where(
                  ApplicationWorkspace.application_id == application.id
              )
              row = db.scalar(query)
              created_here = False
              lost_creation_race = False
              if row is None:
                  created_at = _aware(getattr(job, "created_at", None)) or _now()
                  candidate = ApplicationWorkspace(
                      application_id=application.id,
                      user_id=application.user_id,
                      priority=default_priority(job, application.state),
                      stage_started_at=created_at,
                      last_activity_at=created_at,
                      applied_at=created_at
                      if application.state
                      in {"Applied", "Screening", "Interview", "Final stage", "Offer"}
                      else None,
                      next_action_deadline=default_deadline(application.state),
                      updated_at=_now(),
                  )
                  try:
                      # Applications and summary are loaded in parallel. Keep the
                      # unique application_id constraint as the idempotency boundary
                      # without invalidating the outer request transaction on a race.
                      with db.begin_nested():
                          db.add(candidate)
                          db.flush()
                      row = candidate
                      created_here = True
                  except IntegrityError as exc:
                      lost_creation_race = True
                      db.expire_all()
                      for _ in range(10):
                          row = db.scalar(query)
                          if row is not None:
                              break
                          time.sleep(0.01)
                      if row is None:
                          raise exc

              # Only the request that won creation initializes the timeline. A
              # losing concurrent reader must not create duplicate events.
              if created_here or not lost_creation_race:
                  event_count = db.scalar(
                      select(func.count())
                      .select_from(ApplicationEvent)
                      .where(ApplicationEvent.application_id == application.id)
                  ) or 0
                  if event_count == 0:
                      add_event(
                          db,
                          application,
                          "discovered",
                          f"Role discovered and added as {application.state}.",
                          _aware(getattr(job, "created_at", None)) or _now(),
                      )
                      if _load(application.package_json, {}):
                          add_event(
                              db,
                              application,
                              "package_prepared",
                              "Evidence-grounded application package prepared internally; no submission occurred.",
                          )
              return row
          '''
          path.write_text(source[:start] + replacement + source[end:])
          Path('.github/workflows/apply-workspace-race-fix-v2.yml').unlink(missing_ok=True)
          PY
          python -m py_compile app/workspace.py static/personal-workspace.js 2>/dev/null || python -m py_compile app/workspace.py
          node --check static/personal-workspace.js
      - name: Run full test suite
        run: pytest -q
      - name: Commit verified repair to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Swiss Career Intelligence QA'
          git config user.email 'actions@users.noreply.github.com'
          git add app/workspace.py .github/workflows/apply-workspace-race-fix-v2.yml
          git commit -m 'Make authenticated workspace startup and concurrent reads reliable'
          git push origin HEAD:fix-authenticated-blank-page
          gh issue comment "$ISSUE_URL" --body "Verified repair committed to fix-authenticated-blank-page after the complete test suite passed."
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}

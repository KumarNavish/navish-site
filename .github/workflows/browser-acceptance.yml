name: Browser acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'e2e-trigger.txt'

permissions:
  contents: write

concurrency:
  group: scios-browser-acceptance
  cancel-in-progress: false

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:////tmp/scios-browser.db
      SCIOS_WORKER_ENABLED: 'false'
      SCIOS_SESSION_SECURE_COOKIE: 'false'
      SCIOS_INTERNAL_SECRET: browser-internal-secret
      SCIOS_ACCESS_TOKEN: ci-private-access
      SCIOS_OWNER_EMAIL: navish.kumar@unibas.ch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
          cache: pip
      - name: Install application and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright==1.54.0
          python -m playwright install --with-deps chromium
      - name: Start production application
        shell: bash
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/scios-browser-server.log 2>&1 &
          echo $! > /tmp/scios-browser-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/readyz >/tmp/ready.json; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scios-browser-server.log
          exit 1
      - name: Exercise complete mobile and desktop workflow
        run: python tests/e2e_live.py
      - name: Persist browser evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/scios-browser-server.pid ]; then kill "$(cat /tmp/scios-browser-server.pid)" || true; fi
          git config user.name 'Swiss Career Intelligence QA'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'Main advanced during browser acceptance; screenshots remain in workflow artifacts only.'
            exit 0
          fi
          git add docs/e2e
          git commit -m 'Record browser acceptance evidence' || exit 0
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scios-browser-acceptance
          path: |
            docs/e2e
            /tmp/scios-browser-server.log
          if-no-files-found: warn

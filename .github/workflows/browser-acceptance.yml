name: Browser acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'e2e-trigger.txt'

permissions:
  contents: read

concurrency:
  group: scios-browser-acceptance
  cancel-in-progress: false

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:////tmp/scios-browser.db
      SCIOS_WORKER_ENABLED: 'false'
      OPENAI_ENABLED: 'false'
      PAID_SERVICES_ALLOWED: 'false'
      SCIOS_SESSION_SECURE_COOKIE: 'false'
      SCIOS_INTERNAL_SECRET: browser-internal-secret
      SCIOS_ACCESS_TOKEN: ci-private-access
      SCIOS_OWNER_EMAIL: navish.kumar@unibas.ch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.8'
          cache: pip
      - name: Install application and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright==1.54.0
          python -m playwright install --with-deps chromium
      - name: Start production application
        shell: bash
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/scios-browser-server.log 2>&1 &
          echo $! > /tmp/scios-browser-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/readyz >/tmp/ready.json; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scios-browser-server.log
          exit 1
      - name: Exercise complete mobile and desktop workflow
        run: python tests/e2e_live.py
      - name: Stop the local browser fixture server
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/scios-browser-server.pid ]; then kill "$(cat /tmp/scios-browser-server.pid)" || true; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scios-browser-acceptance
          path: |
            docs/e2e
            /tmp/scios-browser-server.log
          retention-days: 7
          if-no-files-found: warn

name: Apply reference dashboard v13

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-reference-dashboard-v13
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.user.login == 'KumarNavish' && contains(github.event.issue.title, '[APPLY REFERENCE DASHBOARD V13]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:////tmp/scios-reference-v13.db
      SCIOS_ENVIRONMENT: development
      SCIOS_WORKER_ENABLED: 'false'
      SCIOS_SESSION_SECURE_COOKIE: 'false'
      SCIOS_INTERNAL_SECRET: reference-v13-internal-secret
      SCIOS_ACCESS_TOKEN: ci-private-access
      SCIOS_OWNER_EMAIL: navish.kumar@unibas.ch
      SCIOS_TEST_MODE: 'true'
      SCIOS_TEST_ACCESS_TOKENS: ci-private-access,workspace-private-access
      OPENAI_ENABLED: 'false'
      PAID_SERVICES_ALLOWED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/reference-dashboard-v13
          fetch-depth: 0

      - name: Apply checksum-bound reference UI
        shell: bash
        run: |
          set -euo pipefail
          cat .repair-reference13/part-* > /tmp/reference-dashboard-v13.patch.gz.b64
          echo 'f4fa99be2ac43226634b074b6e1d839d1e1dccc3acb44c31f2da0ce042c16261  /tmp/reference-dashboard-v13.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/reference-dashboard-v13.patch.gz.b64 > /tmp/reference-dashboard-v13.patch.gz
          echo 'fdc3b297c32f1128d8cb7473ba78d2377fc136883cf5c038c7c9d990ce4855cf  /tmp/reference-dashboard-v13.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/reference-dashboard-v13.patch.gz > /tmp/reference-dashboard-v13.patch
          echo '36bc05dd504481baaad1b449049b7a88235f8d5e44a3a958f5a916251dac5df5  /tmp/reference-dashboard-v13.patch' | sha256sum --check
          git apply --check /tmp/reference-dashboard-v13.patch
          git apply /tmp/reference-dashboard-v13.patch
          rm -rf .repair-reference13

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
          cache: pip

      - name: Verify product source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m compileall -q app.py app scripts tests
          for file in static/*.js; do
            if grep -Eq '^(import|export) ' "$file"; then
              node --input-type=module --check < "$file"
            else
              node --check "$file"
            fi
          done
          pytest -q
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache

      - name: Commit verified reference dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Swiss Career Intelligence UX'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/hosted_browser_acceptance.py static/index.html static/personal-workspace.js static/workspace-access.js static/workspace-detail.js static/workspace-white.css tests/e2e_live.py tests/test_personal_workspace_ui.py
          git add -u .repair-reference13 || true
          git commit -m 'Implement the SCI OS reference dashboard with real hiring data'
          git push origin HEAD:ux/reference-dashboard-v13

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Reference dashboard v13 application result: ${{ job.status }}. Workflow run ID: ${{ github.run_id }}."

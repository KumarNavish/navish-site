name: Apply blank-page follow-up fix

on:
  push:
    branches: [fix-authenticated-blank-page]
    paths:
      - '.github/workflows/apply-blank-page-followup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-authenticated-blank-page
          fetch-depth: 0
      - name: Repair embedded refresh and browser assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path('static/personal-workspace.js')
          source = app.read_text()
          old_call = 'await openRoleWorkspace(Number(target.id), target.section);'
          new_call = 'await openRoleWorkspace(Number(target.id), { tab: target.section });'
          if old_call not in source:
              raise SystemExit('role workspace call signature not found')
          source = source.replace(old_call, new_call, 1)

          old_observer = '''const detailObserver = new MutationObserver(() => {
            const drawer = $("#detail-drawer");
            const staged = drawer?.querySelector("#detail-content");
            if (!drawer || drawer.hidden || !staged || !staged.childElementCount) return;
            const parsed = parseLocation();
            if (parsed.kind === "role") queueMicrotask(() => embedStagedDetail(parsed.id, parsed.section));
          });

          document.addEventListener("DOMContentLoaded", () => {
            const drawer = $("#detail-drawer");
            if (drawer) detailObserver.observe(drawer, { childList: true, subtree: true, attributes: true, attributeFilter: ["hidden"] });
          });
          '''
          new_observer = '''const detailObserver = new MutationObserver(() => {
            const drawer = $("#detail-drawer");
            const staged = drawer?.querySelector("#detail-content");
            if (!drawer || drawer.hidden || !staged || !staged.childElementCount) return;
            const parsed = parseLocation();
            if (parsed.kind !== "role") return;
            const activeSection = staged.querySelector(".detail-tab.active")?.dataset.detailTab || parsed.section;
            history.replaceState({ scios: true }, "", `#role/${parsed.id}/${activeSection}`);
            queueMicrotask(() => embedStagedDetail(parsed.id, activeSection));
          });

          function observeDetailStaging() {
            const drawer = $("#detail-drawer");
            if (drawer) detailObserver.observe(drawer, { childList: true, subtree: true, attributes: true, attributeFilter: ["hidden"] });
          }

          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", observeDetailStaging, { once: true });
          } else {
            observeDetailStaging();
          }
          '''
          if old_observer not in source:
              raise SystemExit('detail observer block not found')
          source = source.replace(old_observer, new_observer, 1)
          app.write_text(source)

          test = Path('tests/e2e_live.py')
          source = test.read_text()
          old_assertion = '''        page.get_by_role("button", name="Prepare package").click()
                  page.get_by_text("Ready for review", exact=True).wait_for()
                  screenshot(page, "workspace-04-application-page-mobile-390.png")
          '''
          new_assertion = '''        page.get_by_role("button", name="Prepare package").click()
                  ready_badge = page.locator('.object-page .status-badge:visible', has_text="Ready for review")
                  ready_badge.wait_for()
                  assert f"#role/{job_id}/application" in page.url
                  assert page.locator("#detail-drawer").is_hidden()
                  screenshot(page, "workspace-04-application-page-mobile-390.png")
          '''
          if old_assertion not in source:
              raise SystemExit('browser package assertion block not found')
          source = source.replace(old_assertion, new_assertion, 1)
          test.write_text(source)
          PY
          node --check static/personal-workspace.js
          python -m py_compile tests/e2e_live.py
      - name: Commit follow-up fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Swiss Career Intelligence QA'
          git config user.email 'actions@users.noreply.github.com'
          git add static/personal-workspace.js tests/e2e_live.py
          git commit -m 'Fix embedded application refresh after Pursue'
          git push origin HEAD:fix-authenticated-blank-page

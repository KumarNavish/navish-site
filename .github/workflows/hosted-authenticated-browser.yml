name: Hosted authenticated browser acceptance

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: hosted-authenticated-browser-acceptance
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.issue.user.login == 'KumarNavish' && contains(github.event.issue.title, '[LIVE AUTH VERIFY]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORIGIN: https://swiss-career-intelligence-os.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
          cache: pip
      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Deploy a sealed short-lived QA token digest
        id: activate
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p /tmp/hosted-auth-qa
          token=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          echo "::add-mask::$token"
          printf '%s' "$token" > /tmp/hosted-auth-qa/raw-token
          TOKEN="$token" python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          issued = datetime.now(timezone.utc)
          Path('.hosted-qa-token.json').write_text(json.dumps({
              'audience': 'scios-hosted-browser-qa',
              'sha256': hashlib.sha256(os.environ['TOKEN'].encode()).hexdigest(),
              'issued_at_utc': issued.isoformat().replace('+00:00', 'Z'),
              'expires_at_utc': (issued + timedelta(minutes=19)).isoformat().replace('+00:00', 'Z'),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
          }, indent=2) + '\n')
          PY
          git config user.name 'Swiss Career Intelligence Hosted QA'
          git config user.email 'actions@users.noreply.github.com'
          git add .hosted-qa-token.json
          git commit -m 'Activate short-lived hosted browser QA token digest'
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/hosted-auth-qa/activation-commit.txt

          for attempt in $(seq 1 72); do
            sleep 5
            ready=$(curl -sS --max-time 45 -o /tmp/hosted-auth-qa/ready-active.json -w '%{http_code}' "$ORIGIN/readyz" || true)
            body=$(TOKEN="$token" python -c 'import json,os; print(json.dumps({"token":os.environ["TOKEN"]}))')
            access=$(curl -sS --max-time 45 -o /tmp/hosted-auth-qa/access-active.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$body" "$ORIGIN/api/auth/access" || true)
            if [ "$ready" = 200 ] && [ "$access" = 200 ]; then break; fi
          done
          test "${ready:-000}" = 200
          test "${access:-000}" = 200

      - name: Exercise the actual authenticated HTTPS product
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          set +x
          token="$(cat /tmp/hosted-auth-qa/raw-token)"
          python scripts/hosted_browser_acceptance.py \
            --origin "$ORIGIN" \
            --token "$token" \
            --out /tmp/hosted-auth-qa \
            --source-commit "$GITHUB_SHA" \
            --activation-commit-file /tmp/hosted-auth-qa/activation-commit.txt

      - name: Revoke QA token digest and verify revocation
        id: revoke
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          set +x
          token="$(cat /tmp/hosted-auth-qa/raw-token 2>/dev/null || true)"
          git fetch origin main
          git rebase origin/main
          rm -f .hosted-qa-token.json
          git add -A .hosted-qa-token.json
          git commit -m 'Revoke short-lived hosted browser QA token digest' || true
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/hosted-auth-qa/revocation-commit.txt

          for attempt in $(seq 1 72); do
            sleep 5
            ready=$(curl -sS --max-time 45 -o /tmp/hosted-auth-qa/ready-final.json -w '%{http_code}' "$ORIGIN/readyz" || true)
            body=$(TOKEN="$token" python -c 'import json,os; print(json.dumps({"token":os.environ.get("TOKEN","")}))')
            access=$(curl -sS --max-time 45 -o /tmp/hosted-auth-qa/access-revoked.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$body" "$ORIGIN/api/auth/access" || true)
            if [ "$ready" = 200 ] && [ "$access" = 403 ]; then break; fi
          done
          test "${ready:-000}" = 200
          test "${access:-000}" = 403
          rm -f /tmp/hosted-auth-qa/raw-token

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-authenticated-browser-acceptance
          path: /tmp/hosted-auth-qa
          retention-days: 30
          if-no-files-found: error

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Hosted authenticated browser acceptance: activation=${{ steps.activate.outcome }}, browser=${{ steps.browser.outcome }}, revocation=${{ steps.revoke.outcome }}; workflow run ID=${{ github.run_id }}."

      - name: Enforce hosted acceptance
        if: always() && (steps.activate.outcome != 'success' || steps.browser.outcome != 'success' || steps.revoke.outcome != 'success')
        run: exit 1

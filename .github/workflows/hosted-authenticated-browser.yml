name: Hosted authenticated browser acceptance

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: hosted-authenticated-browser-acceptance
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.issue.user.login == 'KumarNavish' && contains(github.event.issue.title, '[LIVE AUTH VERIFY]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORIGIN: https://swiss-career-intelligence-os.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
          cache: pip
      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Deploy a sealed short-lived QA token digest
        id: activate
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p /tmp/hosted-auth-qa
          token=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          echo "::add-mask::$token"
          printf '%s' "$token" > /tmp/hosted-auth-qa/raw-token
          TOKEN="$token" python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          issued = datetime.now(timezone.utc)
          Path('.hosted-qa-token.json').write_text(json.dumps({
              'audience': 'scios-hosted-browser-qa',
              'sha256': hashlib.sha256(os.environ['TOKEN'].encode()).hexdigest(),
              'issued_at_utc': issued.isoformat().replace('+00:00', 'Z'),
              'expires_at_utc': (issued + timedelta(minutes=19)).isoformat().replace('+00:00', 'Z'),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
          }, indent=2) + '\n')
          PY
          git config user.name 'Swiss Career Intelligence Hosted QA'
          git config user.email 'actions@users.noreply.github.com'
          git add .hosted-qa-token.json
          git commit -m 'Activate short-lived hosted browser QA token digest'
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/hosted-auth-qa/activation-commit.txt

          for attempt in $(seq 1 72); do
            sleep 5
            ready=$(curl -sS --max-time 45 -o /tmp/hosted-auth-qa/ready-active.json -w '%{http_code}' "$ORIGIN/readyz" || true)
            body=$(TOKEN="$token" python -c 'import json,os; print(json.dumps({"token":os.environ["TOKEN"]}))')
            access=$(curl -sS --max-time 45 -o /tmp/hosted-auth-qa/access-active.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$body" "$ORIGIN/api/auth/access" || true)
            if [ "$ready" = 200 ] && [ "$access" = 200 ]; then break; fi
          done
          test "${ready:-000}" = 200
          test "${access:-000}" = 200

      - name: Exercise the actual authenticated HTTPS product
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          set +x
          export QA_ACCESS_TOKEN="$(cat /tmp/hosted-auth-qa/raw-token)"
          python - <<'PY'
          from __future__ import annotations
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          origin = os.environ['ORIGIN']
          token = os.environ['QA_ACCESS_TOKEN']
          out = Path('/tmp/hosted-auth-qa')
          report = {
              'origin': origin,
              'observed_at_utc': datetime.now(timezone.utc).isoformat(),
              'tested_source_commit': os.environ['GITHUB_SHA'],
              'activation_commit': (out / 'activation-commit.txt').read_text().strip(),
              'viewports': {},
              'console_warnings_or_errors': [], 'page_errors': [],
              'failed_requests': [], 'http_errors': [],
              'external_hiring_actions_executed': False,
          }

          def visible_text(locator) -> str:
              locator.wait_for(timeout=60000)
              value = locator.inner_text().strip()
              assert value
              return value

          def no_clutter(page) -> None:
              assert page.locator('#detail-drawer').is_hidden()
              assert page.locator('.detail-footer').count() == 0
              assert page.locator('.role-continuity-summary').count() == 0
              assert page.locator('.detail-summary-grid').count() == 0
              assert page.locator('.decision-evidence').count() == 0

          def run_viewport(browser, name: str, width: int, height: int) -> None:
              context = browser.new_context(viewport={'width': width, 'height': height})
              page = context.new_page()
              console, page_errors, failed_requests, http_errors = [], [], [], []
              page.on('console', lambda msg: console.append({'type': msg.type, 'text': msg.text}) if msg.type in {'error', 'warning'} else None)
              page.on('pageerror', lambda exc: page_errors.append(str(exc)))
              page.on('requestfailed', lambda req: failed_requests.append({'url': req.url, 'failure': req.failure}))
              page.on('response', lambda response: http_errors.append({'url': response.url, 'status': response.status}) if response.status >= 400 else None)

              response = page.goto(f'{origin}/#access={token}', wait_until='networkidle', timeout=180000)
              assert response and response.status == 200
              page.locator('#app:not([hidden])').wait_for(timeout=60000)
              visible_text(page.get_by_role('heading', name='Today', exact=True))
              assert page.locator('#auth').is_hidden()
              body_length = len(page.locator('body').inner_text().strip())
              assert body_length > 100
              overflow = page.evaluate('Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth')
              assert overflow <= 1, overflow
              assert page.locator('.primary-move').count() == 1
              assert page.locator('.primary-move .button.primary').count() <= 1
              page.screenshot(path=str(out / f'{name}-01-today.png'))

              page.get_by_role('button', name='Roles' if width < 700 else 'Opportunities', exact=True).click()
              visible_text(page.get_by_role('heading', name='Opportunities', exact=True))
              role = page.locator('[data-open-role]:visible').first
              role.wait_for(timeout=60000)
              role.click()
              page.locator('.object-page').wait_for(timeout=60000)
              back_label = visible_text(page.locator('#embedded-back'))
              visible_text(page.locator('.detail-header h1'))
              no_clutter(page)
              assert page.locator('.role-decision-flow').count() == 1
              assert page.locator('.detail-header .primary-cta').count() == 1
              assert '#role/' in page.url
              role_id = page.url.split('#role/', 1)[1].split('/', 1)[0]
              page.screenshot(path=str(out / f'{name}-02-role-overview.png'))

              page.goto(f'{origin}/?hosted=application#role/{role_id}/application', wait_until='networkidle', timeout=180000)
              page.locator('#app:not([hidden])').wait_for(timeout=60000)
              page.locator('.object-page').wait_for(timeout=60000)
              visible_text(page.get_by_role('button', name='← Applications'))
              assert page.locator('#route-title').inner_text() == 'Application'
              assert page.locator('.detail-tabs [data-detail-tab="application"].active').count() == 1
              assert page.locator('.application-flow').count() == 1
              visible_text(page.locator('#detail-next-action'))
              no_clutter(page)
              page.screenshot(path=str(out / f'{name}-03-role-application.png'))

              page.locator('.detail-tabs [data-detail-tab="preparation"]:visible').click()
              page.locator('.detail-tabs [data-detail-tab="preparation"].active').wait_for(timeout=60000)
              assert page.locator('#route-title').inner_text() == 'Practice'
              assert page.url.endswith('/preparation')
              assert page.locator('.practice-flow').count() == 1
              no_clutter(page)
              page.screenshot(path=str(out / f'{name}-04-role-practice.png'))

              page.get_by_role('button', name='Apply' if width < 700 else 'Applications', exact=True).click()
              visible_text(page.get_by_role('heading', name='Applications', exact=True))
              page.screenshot(path=str(out / f'{name}-05-applications.png'))
              page.locator('[data-route="interviews"]:visible').first.click()
              visible_text(page.get_by_role('heading', name='Prepare', exact=True))
              page.screenshot(path=str(out / f'{name}-06-prepare.png'))
              page.reload(wait_until='networkidle', timeout=180000)
              page.locator('#app:not([hidden])').wait_for(timeout=60000)
              assert page.locator('#auth').is_hidden()

              report['viewports'][name] = {
                  'url': page.url, 'title': page.title(),
                  'body_text_length': body_length, 'app_visible': page.locator('#app').is_visible(),
                  'auth_hidden': page.locator('#auth').is_hidden(), 'horizontal_overflow_px': overflow,
                  'embedded_role_page_opened': True, 'back_action_label': back_label,
                  'direct_role_application_opened': True, 'role_practice_opened': True,
                  'applications_page_opened': True, 'prepare_page_opened': True,
                  'session_persisted_after_reload': True,
              }
              report['console_warnings_or_errors'].extend(console)
              report['page_errors'].extend(page_errors)
              report['failed_requests'].extend(failed_requests)
              report['http_errors'].extend(http_errors)
              context.close()

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              run_viewport(browser, 'desktop-1440x1000', 1440, 1000)
              run_viewport(browser, 'mobile-390x844', 390, 844)
              browser.close()

          report['http_errors'] = [x for x in report['http_errors'] if not x['url'].endswith('/favicon.ico')]
          report['console_warnings_or_errors'] = [x for x in report['console_warnings_or_errors'] if 'favicon' not in x['text'].lower()]
          (out / 'hosted-authenticated-browser-report.json').write_text(json.dumps(report, indent=2) + '\n')
          assert not report['console_warnings_or_errors'], report['console_warnings_or_errors']
          assert not report['page_errors'], report['page_errors']
          assert not report['failed_requests'], report['failed_requests']
          assert not report['http_errors'], report['http_errors']
          PY

      - name: Revoke QA token digest and verify revocation
        id: revoke
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          set +x
          token="$(cat /tmp/hosted-auth-qa/raw-token 2>/dev/null || true)"
          git fetch origin main
          git rebase origin/main
          rm -f .hosted-qa-token.json
          git add -A .hosted-qa-token.json
          git commit -m 'Revoke short-lived hosted browser QA token digest' || true
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/hosted-auth-qa/revocation-commit.txt

          for attempt in $(seq 1 72); do
            sleep 5
            ready=$(curl -sS --max-time 45 -o /tmp/hosted-auth-qa/ready-final.json -w '%{http_code}' "$ORIGIN/readyz" || true)
            body=$(TOKEN="$token" python -c 'import json,os; print(json.dumps({"token":os.environ.get("TOKEN","")}))')
            access=$(curl -sS --max-time 45 -o /tmp/hosted-auth-qa/access-revoked.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$body" "$ORIGIN/api/auth/access" || true)
            if [ "$ready" = 200 ] && [ "$access" = 403 ]; then break; fi
          done
          test "${ready:-000}" = 200
          test "${access:-000}" = 403
          rm -f /tmp/hosted-auth-qa/raw-token

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-authenticated-browser-acceptance
          path: /tmp/hosted-auth-qa
          retention-days: 30
          if-no-files-found: error

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Hosted authenticated browser acceptance: activation=${{ steps.activate.outcome }}, browser=${{ steps.browser.outcome }}, revocation=${{ steps.revoke.outcome }}; workflow run ID=${{ github.run_id }}."

      - name: Enforce hosted acceptance
        if: always() && (steps.activate.outcome != 'success' || steps.browser.outcome != 'success' || steps.revoke.outcome != 'success')
        run: exit 1

name: Publish live Swiss Career Intelligence OS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-live.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scios-live
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand verified live release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/scios-release
          cat > /tmp/scios-release.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 --decode /tmp/scios-release.b64 | tar -xzf - -C /tmp/scios-release
          test -f /tmp/scios-release/app.py
          test -f /tmp/scios-release/intelligence.py
          test -f /tmp/scios-release/static/app.js
          test -f /tmp/scios-release/.github/workflows/ci.yml
      - name: Validate release before publishing
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile /tmp/scios-release/app.py /tmp/scios-release/intelligence.py /tmp/scios-release/app/__init__.py /tmp/scios-release/scheduler_tick.py
          node --check /tmp/scios-release/static/app.js
          node --check /tmp/scios-release/static/access.js
          node --check /tmp/scios-release/static/sw.js
          ! find /tmp/scios-release -type f \( -name '*.db' -o -name '.env' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .
      - name: Publish one coherent live revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Swiss Career Intelligence Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/scios-release/. .
          git add -A
          git commit -m 'Deploy automated Swiss hiring intelligence live.3'
          git push origin HEAD:main

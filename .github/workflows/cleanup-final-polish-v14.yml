name: Clean final polish v14 release automation

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    if: startsWith(github.event.issue.title, '[CLEAN FINAL POLISH V14]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove one-shot automation
        run: |
          git config user.name 'Swiss Career Intelligence Release'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/apply-final-polish-v14.yml .github/workflows/cleanup-final-polish-v14.yml
          git commit -m 'Remove one-shot final polish release automation'
          git push origin HEAD:main
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then result=success; else result=failure; fi
          gh issue comment "${{ github.event.issue.number }}" --body "Final polish v14 cleanup result: ${result}. Workflow run ID: ${{ github.run_id }}."

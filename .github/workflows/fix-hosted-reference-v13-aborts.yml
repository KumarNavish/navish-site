name: Fix hosted reference dashboard navigation abort accounting

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: github.event.issue.user.login == 'KumarNavish' && contains(github.event.issue.title, '[FIX HOSTED REFERENCE V13 ABORTS]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:////tmp/scios-hosted-reference-v13-aborts.db
      SCIOS_ENVIRONMENT: development
      SCIOS_WORKER_ENABLED: 'false'
      SCIOS_SESSION_SECURE_COOKIE: 'false'
      SCIOS_INTERNAL_SECRET: hosted-reference-v13-aborts-secret
      SCIOS_ACCESS_TOKEN: ci-private-access
      SCIOS_OWNER_EMAIL: navish.kumar@unibas.ch
      SCIOS_TEST_MODE: 'true'
      SCIOS_TEST_ACCESS_TOKENS: ci-private-access,workspace-private-access
      OPENAI_ENABLED: 'false'
      PAID_SERVICES_ALLOWED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
          cache: pip

      - name: Ignore browser-cancelled requests during intentional navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/hosted_browser_acceptance.py')
          source = path.read_text()
          old = '''    page.on(
        "requestfailed",
        lambda req: failed_requests.append({"url": req.url, "failure": req.failure}),
    )
'''
          new = '''    page.on(
        "requestfailed",
        lambda req: failed_requests.append({"url": req.url, "failure": req.failure})
        if req.failure != "net::ERR_ABORTED"
        else None,
    )
'''
          if old not in source:
              raise SystemExit('expected requestfailed handler not found')
          path.write_text(source.replace(old, new, 1))

          test_path = Path('tests/test_personal_workspace_ui.py')
          tests = test_path.read_text()
          marker = 'def test_hosted_acceptance_ignores_navigation_aborts() -> None:'
          if marker not in tests:
              tests += '''\n\ndef test_hosted_acceptance_ignores_navigation_aborts() -> None:\n    script = (ROOT / "scripts" / "hosted_browser_acceptance.py").read_text()\n    assert 'req.failure != "net::ERR_ABORTED"' in script\n    assert 'assert not report["failed_requests"]' in script\n'''
              test_path.write_text(tests)
          PY

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m compileall -q app.py app scripts tests
          for file in static/*.js; do
            if grep -Eq '^(import|export) ' "$file"; then
              node --input-type=module --check < "$file"
            else
              node --check "$file"
            fi
          done
          pytest -q

      - name: Commit hosted acceptance repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Swiss Career Intelligence QA'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/hosted_browser_acceptance.py tests/test_personal_workspace_ui.py
          git commit -m 'Treat intentional browser navigation aborts as benign'
          git push origin HEAD:main

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Hosted reference v13 abort-accounting repair: ${{ job.status }}. Workflow run ID: ${{ github.run_id }}."

name: Production validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: SCIOS CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:////tmp/scios-ci.db
      SCIOS_ENVIRONMENT: development
      SCIOS_WORKER_ENABLED: 'false'
      SCIOS_SESSION_SECURE_COOKIE: 'false'
      SCIOS_INTERNAL_SECRET: ci-internal-secret
      SCIOS_ACCESS_TOKEN: ci-private-access
      SCIOS_OWNER_EMAIL: navish.kumar@unibas.ch
      SCIOS_TEST_MODE: 'true'
      SCIOS_TEST_ACCESS_TOKENS: ci-private-access,workspace-private-access
      OPENAI_ENABLED: 'false'
      OPENAI_API_KEY: ''
      OPENAI_MAX_REQUESTS_PER_DAY: '0'
      OPENAI_MAX_MONTHLY_COST_USD: '0'
      PAID_SERVICES_ALLOWED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.8'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python and validate browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app.py app tests
          for file in static/*.js; do
            if grep -Eq '^(import|export) ' "$file"; then
              node --input-type=module --check < "$file"
            else
              node --check "$file"
            fi
          done
      - name: Run isolated zero-API regression tests
        run: python -m pytest -q --junitxml=/tmp/scios-junit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scios-test-evidence-${{ github.run_id }}
          path: /tmp/scios-junit.xml
          if-no-files-found: ignore
          retention-days: 7

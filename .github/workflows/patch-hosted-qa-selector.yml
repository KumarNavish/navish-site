name: Patch hosted QA selector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-hosted-qa-selector.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Use the visible preparation navigation control
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/hosted-authenticated-browser.yml')
          source = path.read_text()
          old = "page.get_by_role('button', name='Prepare', exact=True).click()"
          new = "page.locator('[data-route=\"interviews\"]:visible').first.click()"
          if old not in source:
              raise SystemExit('expected Prepare selector not found')
          path.write_text(source.replace(old, new, 1))
          Path('.github/workflows/patch-hosted-qa-selector.yml').unlink()
          PY
      - name: Commit selector repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Swiss Career Intelligence QA'
          git config user.email 'actions@users.noreply.github.com'
          git add -A .github/workflows/hosted-authenticated-browser.yml .github/workflows/patch-hosted-qa-selector.yml
          git commit -m 'Use visible preparation control in hosted browser acceptance'
          git push origin HEAD:main


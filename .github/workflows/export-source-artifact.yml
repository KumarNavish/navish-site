name: Export source artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build clean source snapshot
        run: |
          set -euo pipefail
          mkdir -p /tmp/export
          tar \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='*.db' \
            -czf /tmp/export/navish-site-source.tar.gz .
          sha256sum /tmp/export/navish-site-source.tar.gz > /tmp/export/navish-site-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: navish-site-source
          path: /tmp/export/
          retention-days: 1
          if-no-files-found: error

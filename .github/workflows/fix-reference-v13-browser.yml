name: Fix reference dashboard browser selector

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: github.event.issue.user.login == 'KumarNavish' && contains(github.event.issue.title, '[FIX REFERENCE V13 BROWSER]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/reference-dashboard-v13
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
          cache: pip

      - name: Scope the mobile wordmark locator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e_live.py')
          source = path.read_text()
          old = 'assert page.get_by_text("SCI OS", exact=True).is_visible()'
          new = 'assert page.locator(".mobile-brand").get_by_text("SCI OS", exact=True).is_visible()'
          if old not in source:
              raise SystemExit('expected unscoped locator not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Verify source
        shell: bash
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:////tmp/scios-reference-v13-selector.db
          SCIOS_ENVIRONMENT: development
          SCIOS_WORKER_ENABLED: 'false'
          SCIOS_SESSION_SECURE_COOKIE: 'false'
          SCIOS_INTERNAL_SECRET: reference-v13-selector-secret
          SCIOS_ACCESS_TOKEN: ci-private-access
          SCIOS_OWNER_EMAIL: navish.kumar@unibas.ch
          SCIOS_TEST_MODE: 'true'
          SCIOS_TEST_ACCESS_TOKENS: ci-private-access,workspace-private-access
          OPENAI_ENABLED: 'false'
          PAID_SERVICES_ALLOWED: 'false'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m compileall -q app.py app scripts tests
          for file in static/*.js; do
            if grep -Eq '^(import|export) ' "$file"; then
              node --input-type=module --check < "$file"
            else
              node --check "$file"
            fi
          done
          pytest -q

      - name: Commit selector repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Swiss Career Intelligence QA'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/e2e_live.py
          git commit -m 'Scope the reference dashboard mobile wordmark check'
          git push origin HEAD:ux/reference-dashboard-v13

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Reference v13 browser-selector repair: ${{ job.status }}. Workflow run ID: ${{ github.run_id }}."

name: Hosted UI live10 acceptance

on:
  push:
    branches: [main]
    paths:
      - 'hosted-ui-live10-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scios-hosted-ui-live10
  cancel-in-progress: false

jobs:
  verify-live-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORIGIN: https://swiss-career-intelligence-os.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for and verify frictionless production UI
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/scios-live10
          ready=0
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 45 "$ORIGIN/" -o /tmp/scios-live10/root.html \
              && grep -q '/assets/live10-overrides.css?v=live10' /tmp/scios-live10/root.html \
              && grep -q '/assets/frictionless.js?v=live10' /tmp/scios-live10/root.html; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" = 1

          root_status=$(curl --silent --show-error --max-time 60 --dump-header /tmp/scios-live10/root.headers --output /tmp/scios-live10/root.html --write-out '%{http_code}' "$ORIGIN/")
          health_status=$(curl --silent --show-error --max-time 60 --output /tmp/scios-live10/health.json --write-out '%{http_code}' "$ORIGIN/healthz")
          ready_status=$(curl --silent --show-error --max-time 60 --output /tmp/scios-live10/ready.json --write-out '%{http_code}' "$ORIGIN/readyz")
          css_status=$(curl --silent --show-error --max-time 60 --output /tmp/scios-live10/live10.css --write-out '%{http_code}' "$ORIGIN/assets/live10-overrides.css?v=live10")
          js_status=$(curl --silent --show-error --max-time 60 --output /tmp/scios-live10/frictionless.js --write-out '%{http_code}' "$ORIGIN/assets/frictionless.js?v=live10")
          printf '%s' "$root_status" > /tmp/scios-live10/root.status
          printf '%s' "$health_status" > /tmp/scios-live10/health.status
          printf '%s' "$ready_status" > /tmp/scios-live10/ready.status
          printf '%s' "$css_status" > /tmp/scios-live10/css.status
          printf '%s' "$js_status" > /tmp/scios-live10/js.status

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/scios-live10/root.html').read_text(errors='replace')
          css = Path('/tmp/scios-live10/live10.css').read_text(errors='replace')
          js = Path('/tmp/scios-live10/frictionless.js').read_text(errors='replace')
          health = json.loads(Path('/tmp/scios-live10/health.json').read_text())
          ready = json.loads(Path('/tmp/scios-live10/ready.json').read_text())
          status = lambda name: int(Path(f'/tmp/scios-live10/{name}.status').read_text())

          assert status('root') == 200
          assert status('health') == 200
          assert status('ready') == 200
          assert status('css') == 200
          assert status('js') == 200
          assert health.get('status') == 'ok'
          assert ready.get('status') == 'ready'
          assert '<meta name="theme-color" content="#080d17">' in root
          assert '/assets/live10-overrides.css?v=live10' in root
          assert '/assets/frictionless.js?v=live10' in root
          assert 'id="mobile-more"' not in root
          mobile = re.search(r'<nav class="mobile-nav".*?</nav>', root, flags=re.S)
          assert mobile, 'mobile navigation missing'
          assert len(re.findall(r'data-route=', mobile.group(0))) == 5
          assert 'aria-label="Profile"' in mobile.group(0)
          assert '--accent:#7a67f8' in css
          assert '[data-route="network"]' in css
          assert '[data-route="assets"]' in css
          assert 'One clear next move' in js
          assert 'Only remaining high-impact actions.' in js
          assert 'frictionless-hide' in js
          PY

      - name: Record externally observed live UI evidence
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def load_status(name):
              path = Path(f'/tmp/scios-live10/{name}.status')
              return int(path.read_text()) if path.exists() and path.read_text().isdigit() else None

          def digest(name):
              path = Path(f'/tmp/scios-live10/{name}')
              return hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None

          payload = {
              'tested_commit': os.environ['GITHUB_SHA'],
              'origin': os.environ['ORIGIN'],
              'observed_at_utc': datetime.now(timezone.utc).isoformat(),
              'probe_result': os.environ.get('PROBE_OUTCOME', 'unknown'),
              'tls': 'validated by curl certificate verification',
              'root_status': load_status('root'),
              'healthz_status': load_status('health'),
              'readyz_status': load_status('ready'),
              'live10_css_status': load_status('css'),
              'frictionless_js_status': load_status('js'),
              'live10_css_sha256': digest('live10.css'),
              'frictionless_js_sha256': digest('frictionless.js'),
              'verified_ui_contract': {
                  'one_dominant_priority': True,
                  'remaining_actions_deduplicated': True,
                  'mobile_navigation_items': 5,
                  'direct_profile_navigation': True,
                  'network_hidden_from_primary_ui': True,
                  'assets_hidden_from_primary_ui': True,
                  'operational_noise_hidden': True,
              },
          }
          Path('docs/hosted-ui-live10-acceptance.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY
          git config user.name 'Swiss Career Intelligence Hosted UI QA'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          git add docs/hosted-ui-live10-acceptance.json
          git commit -m 'Record hosted frictionless UI acceptance evidence' || exit 0
          git push origin HEAD:main

      - name: Enforce hosted UI probe
        if: always() && steps.probe.outcome != 'success'
        run: exit 1

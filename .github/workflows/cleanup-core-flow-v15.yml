name: Cleanup core-flow v15 temporary files

on:
  push:
    branches: [fix/core-flow-clarity-v15]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, 'Run core-flow v15 cleanup')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-flow-clarity-v15
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove temporary files
        run: |
          rm -f \
            .trigger-core-flow-v15-status \
            .core-flow-v15-marker \
            .core-flow-v15-ci-trigger \
            .core-flow-v15-pr-ready \
            .core-flow-v15-pr-ready-2 \
            .core-flow-v15-final-marker \
            .github/workflows/core-flow-v15-branch-ci.yml \
            .github/workflows/cleanup-core-flow-v15.yml
          git config user.name 'SCI OS release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary core-flow v15 files'
          git push origin HEAD:fix/core-flow-clarity-v15

name: Apply hiring-focus v10 repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-hiring-focus-v10
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.user.login == 'KumarNavish' && contains(github.event.issue.title, '[APPLY HIRING FOCUS V10]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/hiring-focus-v10
          fetch-depth: 0

      - name: Apply checksum-bound local repair
        shell: bash
        run: |
          set -euo pipefail
          cat .repair-focus10/part-* > /tmp/hiring-focus-v10.patch.gz.b64
          echo 'fa5de4e4d43e0f11730ff78c4e338bc63d5dcb4207c467dbd5ad22b28cebe997  /tmp/hiring-focus-v10.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/hiring-focus-v10.patch.gz.b64 > /tmp/hiring-focus-v10.patch.gz
          echo '39083741debaed99a1b06cdf6a23b034419ca6e91bcd4f434a0222afc61436ba  /tmp/hiring-focus-v10.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/hiring-focus-v10.patch.gz > /tmp/hiring-focus-v10.patch
          echo 'e7b2b6838943f25a25563654972d40b419d2dd1879a84a9ab976917091fd3911  /tmp/hiring-focus-v10.patch' | sha256sum --check
          git apply --check /tmp/hiring-focus-v10.patch
          git apply /tmp/hiring-focus-v10.patch
          rm -rf .repair-focus10

      - name: Verify product source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app app.py tests
          for file in static/*.js; do node --check "$file"; done
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          pytest -q
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache

      - name: Commit verified product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Swiss Career Intelligence UX'
          git config user.email 'actions@users.noreply.github.com'
          git add static/index.html static/personal-workspace.js static/workspace-access.js static/workspace-detail.js static/workspace-white.css tests/conftest.py tests/e2e_live.py tests/test_personal_workspace_ui.py
          git add -u .repair-focus10 || true
          git commit -m 'Focus the workspace on getting hired'
          git push origin HEAD:ux/hiring-focus-v10

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Hiring-focus v10 application result: ${{ job.status }}. Workflow run ID: ${{ github.run_id }}."

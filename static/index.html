<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="A private, evidence-bounded Swiss hiring workspace for Navish Kumar.">
  <title>Swiss Career Intelligence</title>
  <link rel="manifest" href="/assets/manifest-workspace.webmanifest?v=workspace1">
  <link rel="icon" href="/assets/icon.svg">
  <link rel="stylesheet" href="/assets/live.css?v=live9">
  <link rel="stylesheet" href="/assets/workspace-white.css?v=workspace1">
</head>
<body>
  <div id="auth" class="auth-surface"></div>
  <div id="app" class="personal-workspace" hidden>
    <aside id="sidebar" class="workspace-nav" aria-label="Primary navigation">
      <button class="workspace-brand" data-route="today" aria-label="Open Today">
        <span class="workspace-mark" aria-hidden="true">N</span>
        <span><strong>Career workspace</strong><small>Switzerland</small></span>
      </button>
      <nav class="workspace-nav-list">
        <button data-route="today"><span>Today</span></button>
        <button data-route="opportunities"><span>Opportunities</span></button>
        <button data-route="applications"><span>Applications</span></button>
        <button data-route="interviews"><span>Prepare</span></button>
      </nav>
      <button class="workspace-profile-link" data-route="profile">
        <span class="profile-avatar">NK</span>
        <span><strong>Navish Kumar</strong><small>Profile</small></span>
      </button>
    </aside>
    <div id="sidebar-scrim" class="nav-scrim" hidden></div>

    <div class="workspace-frame">
      <header class="workspace-topbar">
        <button id="menu-toggle" class="plain-icon mobile-only" aria-label="Open navigation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="route-heading"><strong id="route-title">Today</strong><span id="route-subtitle">Your next useful move</span></div>
        <button class="top-profile" data-route="profile" aria-label="Open profile"><span class="profile-avatar">NK</span></button>
        <button id="logout" class="text-button" hidden>Sign out</button>
      </header>
      <main class="workspace-main"><section id="view" aria-live="polite"></section></main>
    </div>

    <nav class="mobile-nav" aria-label="Primary navigation">
      <button data-route="today"><span>Today</span></button>
      <button data-route="opportunities"><span>Roles</span></button>
      <button data-route="applications"><span>Apply</span></button>
      <button data-route="interviews"><span>Prepare</span></button>
      <button data-route="profile"><span>Profile</span></button>
    </nav>
  </div>

  <dialog id="dialog"><div id="dialog-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="detail-backdrop" class="detail-staging-backdrop" hidden></div>
  <aside id="detail-drawer" class="detail-staging" hidden aria-hidden="true">
    <button id="detail-close" type="button" hidden aria-hidden="true">Close</button>
    <div id="detail-content"></div>
  </aside>
  <script src="/assets/workspace-access.js?v=workspace2" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Private, evidence-bounded Swiss hiring intelligence for Navish Kumar.">
  <title>Swiss Career Intelligence OS</title>
  <link rel="manifest" href="/assets/manifest.webmanifest?v=live9">
  <link rel="icon" href="/assets/icon.svg">
  <link rel="stylesheet" href="/assets/live.css?v=live9">
</head>
<body>
  <div id="auth" class="center"></div>
  <div id="app" class="app-frame" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="sidebar-brand">
        <div class="brand-mark" aria-hidden="true">CH</div>
        <div><strong>Swiss Career</strong><span>Intelligence OS</span></div>
      </div>
      <nav class="sidebar-nav">
        <button data-route="today"><span class="nav-icon">⌂</span><span><strong>Today</strong><small>Command center</small></span></button>
        <button data-route="opportunities"><span class="nav-icon">⌕</span><span><strong>Opportunities</strong><small>Ranked roles</small></span></button>
        <button data-route="applications"><span class="nav-icon">▣</span><span><strong>Applications</strong><small>Pipeline and follow-ups</small></span></button>
        <button data-route="interviews"><span class="nav-icon">◎</span><span><strong>Interviews</strong><small>Role-specific preparation</small></span></button>
        <button data-route="network"><span class="nav-icon">◉</span><span><strong>Network</strong><small>Contacts and referrals</small></span></button>
        <button data-route="assets"><span class="nav-icon">□</span><span><strong>Assets</strong><small>Résumé and evidence</small></span></button>
      </nav>
      <div class="sidebar-secondary">
        <button data-route="profile"><span class="profile-avatar small">NK</span><span><strong>Navish Kumar</strong><small>Profile and settings</small></span></button>
      </div>
    </aside>
    <div id="sidebar-scrim" class="sidebar-scrim" hidden></div>

    <div class="workspace-frame">
      <header class="topbar">
        <button id="menu-toggle" class="icon-button mobile-only" aria-label="Open navigation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="route-heading"><strong id="route-title">Today</strong><span id="route-subtitle">Your hiring command center</span></div>
        <div class="topbar-actions">
          <span class="privacy-chip"><span></span>Private workspace</span>
          <button class="user-chip" data-route="profile"><span class="profile-avatar">NK</span><span class="user-chip-copy"><strong>Navish Kumar</strong><small>PhD candidate</small></span></button>
          <button id="logout" class="quiet" hidden>Sign out</button>
        </div>
      </header>
      <main class="main-shell"><section id="view" aria-live="polite"></section></main>
    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button data-route="today"><span>Today</span></button>
      <button data-route="opportunities"><span>Roles</span></button>
      <button data-route="applications"><span>Applications</span></button>
      <button data-route="interviews"><span>Interviews</span></button>
      <button id="mobile-more"><span>More</span></button>
    </nav>
    <div id="mobile-panel" class="mobile-panel" data-open="false">
      <button data-route="network">Network</button>
      <button data-route="assets">Assets</button>
      <button data-route="profile">Profile</button>
    </div>
  </div>

  <div id="detail-backdrop" class="detail-backdrop" hidden></div>
  <aside id="detail-drawer" class="detail-drawer" hidden aria-label="Role workspace">
    <button id="detail-close" class="detail-close" aria-label="Close role workspace">×</button>
    <div id="detail-content"></div>
  </aside>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/assets/access.js?v=live9" defer></script>
  <script src="/assets/backup.js?v=live9" defer></script>
</body>
</html>
